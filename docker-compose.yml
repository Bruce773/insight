services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: insight
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - insight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  insight_pgdata:
